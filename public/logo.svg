<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#0a1929"/>
    </linearGradient>
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee0e8"/>
      <stop offset="55%" stop-color="#2b9fe6"/>
      <stop offset="100%" stop-color="#3b6ef0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="290" fill="url(#bgGrad)"/>
  <circle cx="300" cy="300" r="290" fill="none" stroke="#3ee0e8" stroke-opacity="0.25" stroke-width="2"/>

  <g stroke="#3ee0e8" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M 90 300 L 140 300 L 158 282"/>
    <path d="M 510 300 L 460 300 L 442 318"/>
    <path d="M 300 90 L 300 140 L 282 158"/>
    <path d="M 300 510 L 300 460 L 318 442"/>
  </g>
  <g fill="#3ee0e8" fill-opacity="0.7">
    <circle cx="90" cy="300" r="5"/>
    <circle cx="510" cy="300" r="5"/>
    <circle cx="300" cy="90" r="5"/>
    <circle cx="300" cy="510" r="5"/>
  </g>

  <text x="300" y="345"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="800"
        font-size="200"
        text-anchor="middle"
        fill="url(#letterGrad)"
        filter="url(#softGlow)"
        letter-spacing="-6">Ptm</text>

  <rect x="185" y="378" width="230" height="6" rx="3" fill="url(#letterGrad)" opacity="0.9"/>
</svg>
